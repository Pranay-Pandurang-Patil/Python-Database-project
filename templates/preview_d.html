<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design D: The Merchant's Ledger</title>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700&family=Lato:wght@400;700&display=swap"
        rel="stylesheet">
    <style>
        :root {
            --bg-parchment: #f4e4bc;
            --wood-dark: #4a3423;
            --wood-light: #8b5a2b;
            --ink: #2c1810;
            --gold: #d4af37;
            --red: #8a2323;
        }

        body {
            background-color: var(--wood-dark);
            color: var(--ink);
            font-family: 'Lato', sans-serif;
            margin: 0;
            padding: 40px;
            background-image: url("data:image/svg+xml,%3Csvg width='40' height='40' viewBox='0 0 40 40' xmlns='http://www.w3.org/2000/svg'%3E%3Cpath d='M20 20.5V18H0v-2h20v-2H0v-2h20v-2H0V8h20V6H0V4h20V2H0V0h22v20h2V0h2v20h2V0h2v20h2V0h2v20h2v2H22v-2h-2v2h-2v2h-2v2h-2v2h-2v2h-2v2h-2v2h-2v-2h2v-2h2v-2h2v-2h2v-2h2v-2h2v-2h2v-2h2v-2h2v-2h2z' fill='%233e2b1d' fill-opacity='0.1' fill-rule='evenodd'/%3E%3C/svg%3E");
        }

        .container {
            max-width: 900px;
            margin: 0 auto;
            background-color: var(--bg-parchment);
            box-shadow: 0 0 20px rgba(0, 0, 0, 0.5), inset 0 0 60px rgba(139, 90, 43, 0.3);
            border: 8px solid var(--wood-light);
            border-radius: 4px;
            padding: 40px;
            position: relative;
        }

        /* Decorative corners */
        .container::before,
        .container::after {
            content: '⚜';
            position: absolute;
            font-size: 24px;
            color: var(--wood-dark);
        }

        .container::before {
            top: 10px;
            left: 10px;
        }

        .container::after {
            top: 10px;
            right: 10px;
        }

        .header {
            text-align: center;
            border-bottom: 2px solid var(--ink);
            margin-bottom: 30px;
            padding-bottom: 20px;
        }

        h1 {
            font-family: 'Cinzel', serif;
            font-size: 2.5em;
            margin: 0;
            text-transform: uppercase;
            color: var(--wood-dark);
            text-shadow: 1px 1px 0 rgba(255, 255, 255, 0.5);
        }

        .nav {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 15px;
        }

        .nav a {
            text-decoration: none;
            color: var(--ink);
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            padding: 5px 15px;
            border: 1px solid transparent;
            transition: all 0.3s;
        }

        .nav a.active,
        .nav a:hover {
            border: 1px solid var(--ink);
            border-radius: 20px;
            background: rgba(138, 35, 35, 0.1);
        }

        .scroll-box {
            border: 2px solid var(--ink);
            padding: 5px;
            border-radius: 2px;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-family: 'Cinzel', serif;
        }

        th {
            text-align: left;
            border-bottom: 2px solid var(--ink);
            padding: 10px;
            font-size: 1.1em;
            color: var(--wood-dark);
        }

        td {
            padding: 15px 10px;
            border-bottom: 1px solid rgba(44, 24, 16, 0.2);
            font-family: 'Lato', sans-serif;
            font-weight: 700;
        }

        tr:last-child td {
            border-bottom: none;
        }

        tr:hover td {
            background-color: rgba(138, 35, 35, 0.05);
        }

        .gold-text {
            color: var(--wood-light);
            font-weight: 900;
        }

        .btn-rpg {
            background: var(--red);
            color: #fff;
            border: 2px solid #5a1515;
            padding: 12px 30px;
            font-family: 'Cinzel', serif;
            font-size: 1.1em;
            cursor: pointer;
            box-shadow: 0 4px 0 #5a1515;
            transition: all 0.1s;
            display: block;
            margin: 30px auto 0;
            width: fit-content;
        }

        .btn-rpg:active {
            transform: translateY(4px);
            box-shadow: 0 0 0 #5a1515;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="header">
            <h1>The Merchant's Ledger</h1>
            <div class="nav">
                <a href="#" class="active">Quests (Orders)</a>
                <a href="#">Wares</a>
                <a href="#">New Trade</a>
            </div>
        </div>

        <div class="scroll-box">
            <table>
                <thead>
                    <tr>
                        <th>Scroll #</th>
                        <th>Adventurer</th>
                        <th>Moon Phase</th>
                        <th>Tribute</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>#1024</td>
                        <td>Lady Connor</td>
                        <td>Waxing Crescent</td>
                        <td class="gold-text">145.50 GP</td>
                    </tr>
                    <tr>
                        <td>#1025</td>
                        <td>Ranger Aragorn</td>
                        <td>Full Moon</td>
                        <td class="gold-text">89.99 GP</td>
                    </tr>
                    <tr>
                        <td>#1026</td>
                        <td>Mage Ripley</td>
                        <td>New Moon</td>
                        <td class="gold-text">210.00 GP</td>
                    </tr>
                </tbody>
            </table>
        </div>

        <button class="btn-rpg">Forging New Contract</button>
    </div>
</body>

</html>
