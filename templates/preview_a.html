<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design A: Neon Operative</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600&family=Orbitron:wght@500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-primary: #06b6d4; /* Cyan */
            --accent-secondary: #d946ef; /* Magenta */
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: 'Inter', sans-serif;
            margin: 0;
            padding: 20px;
            background-image: linear-gradient(0deg, transparent 24%, rgba(6, 182, 212, .05) 25%, rgba(6, 182, 212, .05) 26%, transparent 27%, transparent 74%, rgba(6, 182, 212, .05) 75%, rgba(6, 182, 212, .05) 76%, transparent 77%, transparent), linear-gradient(90deg, transparent 24%, rgba(6, 182, 212, .05) 25%, rgba(6, 182, 212, .05) 26%, transparent 27%, transparent 74%, rgba(6, 182, 212, .05) 75%, rgba(6, 182, 212, .05) 76%, transparent 77%, transparent);
            background-size: 50px 50px;
        }

        h1, h2, h3, .brand {
            font-family: 'Orbitron', sans-serif;
            text-transform: uppercase;
            letter-spacing: 2px;
            text-shadow: 0 0 10px rgba(6, 182, 212, 0.5);
        }

        .container {
            max-width: 1000px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 40px;
            padding-bottom: 20px;
            border-bottom: 2px solid var(--accent-primary);
            box-shadow: 0 4px 15px -5px var(--accent-primary);
        }

        .nav a {
            color: var(--text-secondary);
            text-decoration: none;
            margin-left: 20px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.9em;
            transition: all 0.3s;
        }

        .nav a:hover, .nav a.active {
            color: var(--accent-primary);
            text-shadow: 0 0 8px var(--accent-primary);
        }

        .card {
            background: var(--card-bg);
            border: 1px solid rgba(6, 182, 212, 0.3);
            border-radius: 4px;
            padding: 20px;
            margin-bottom: 20px;
            position: relative;
            overflow: hidden;
        }

        .card::before {
            content: '';
            position: absolute;
            top: 0;
            left: 0;
            width: 4px;
            height: 100%;
            background: var(--accent-primary);
            box-shadow: 0 0 10px var(--accent-primary);
        }

        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 10px;
        }

        th {
            text-align: left;
            color: var(--accent-secondary);
            padding: 15px;
            font-family: 'Orbitron', sans-serif;
            font-size: 0.8em;
            border-bottom: 1px solid rgba(255,255,255,0.1);
        }

        td {
            padding: 15px;
            border-bottom: 1px solid rgba(255,255,255,0.05);
        }

        tr:hover td {
            background: rgba(6, 182, 212, 0.05);
            color: var(--accent-primary);
            cursor: pointer;
        }

        .badge {
            background: rgba(217, 70, 239, 0.2);
            color: var(--accent-secondary);
            padding: 4px 8px;
            border-radius: 2px;
            font-size: 0.8em;
            border: 1px solid var(--accent-secondary);
            box-shadow: 0 0 5px var(--accent-secondary);
        }

        .btn {
            background: transparent;
            color: var(--accent-primary);
            border: 1px solid var(--accent-primary);
            padding: 10px 20px;
            font-family: 'Orbitron', sans-serif;
            cursor: pointer;
            transition: 0.3s;
            text-transform: uppercase;
        }

        .btn:hover {
            background: var(--accent-primary);
            color: #000;
            box-shadow: 0 0 15px var(--accent-primary);
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <div class="brand">Grocery_OS // v4.0</div>
            <div class="nav">
                <a href="#" class="active">Dashboard</a>
                <a href="#">Inventory</a>
                <a href="#">New Order</a>
            </div>
        </div>

        <div class="card">
            <h2>Active Missions (Orders)</h2>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Operative</th>
                        <th>Timestamp</th>
                        <th>Value</th>
                    </tr>
                </thead>
                <tbody>
                    <tr>
                        <td>#1024</td>
                        <td>Sarah Connor</td>
                        <td>2023-12-25 14:30</td>
                        <td><span class="badge">$145.50</span></td>
                    </tr>
                    <tr>
                        <td>#1025</td>
                        <td>Rick Deckard</td>
                        <td>2023-12-25 16:45</td>
                        <td><span class="badge">$89.99</span></td>
                    </tr>
                    <tr>
                        <td>#1026</td>
                        <td>Ellen Ripley</td>
                        <td>2023-12-26 09:12</td>
                        <td><span class="badge">$210.00</span></td>
                    </tr>
                </tbody>
            </table>
        </div>

        <div style="text-align: center; margin-top: 40px;">
            <button class="btn">Initiate New Order</button>
        </div>
    </div>
</body>
</html>
