<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Design E: Hyper Clean</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #f3f4f6;
            --surface: #ffffff;
            --primary: #4f46e5;
            /* Indigo */
            --accent: #ec4899;
            /* Pink */
            --text-main: #111827;
            --text-sub: #6b7280;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-main);
            font-family: 'Outfit', sans-serif;
            margin: 0;
            padding: 40px;
        }

        .container {
            max-width: 1100px;
            margin: 0 auto;
        }

        .top-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 30px;
            background: var(--surface);
            padding: 15px 30px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .logo {
            font-weight: 800;
            font-size: 1.5em;
            background: linear-gradient(45deg, var(--primary), var(--accent));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-transform: uppercase;
            letter-spacing: -1px;
        }

        .menu a {
            text-decoration: none;
            color: var(--text-sub);
            font-weight: 500;
            margin-left: 30px;
            transition: 0.2s;
        }

        .menu a.active {
            color: var(--primary);
            font-weight: 700;
        }

        .dashboard-grid {
            display: grid;
            grid-template-columns: 250px 1fr;
            gap: 30px;
        }

        .sidebar-stats {
            display: flex;
            flex-direction: column;
            gap: 20px;
        }

        .stat-card {
            background: var(--surface);
            padding: 20px;
            border-radius: 16px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .stat-label {
            color: var(--text-sub);
            font-size: 0.85em;
            font-weight: 600;
            text-transform: uppercase;
        }

        .stat-val {
            font-size: 2em;
            font-weight: 800;
            margin-top: 5px;
            color: var(--text-main);
        }

        .main-content {
            background: var(--surface);
            border-radius: 20px;
            padding: 30px;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.05);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th {
            text-align: left;
            padding: 15px 10px;
            color: var(--text-sub);
            font-size: 0.8em;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border-bottom: 2px solid #f3f4f6;
        }

        td {
            padding: 20px 10px;
            border-bottom: 1px solid #f9fafb;
            font-weight: 500;
        }

        .tag {
            background: #e0e7ff;
            color: var(--primary);
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85em;
            font-weight: 700;
        }

        .btn-modern {
            background: var(--text-main);
            color: #fff;
            border: none;
            padding: 15px 30px;
            border-radius: 12px;
            font-weight: 700;
            font-family: 'Outfit', sans-serif;
            font-size: 1em;
            cursor: pointer;
            width: 100%;
            margin-top: 20px;
            transition: 0.2s;
        }

        .btn-modern:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 20px -5px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="top-bar">
            <div class="logo">Admin // Hub</div>
            <div class="menu">
                <a href="#" class="active">Orders</a>
                <a href="#">Products</a>
                <a href="#">Settings</a>
            </div>
        </div>

        <div class="dashboard-grid">
            <div class="sidebar-stats">
                <div class="stat-card">
                    <div class="stat-label">Total Revenue</div>
                    <div class="stat-val">$45.2k</div>
                </div>
                <div class="stat-card">
                    <div class="stat-label">Pending</div>
                    <div class="stat-val">12</div>
                </div>
            </div>

            <div class="main-content">
                <h2 style="margin-top: 0">Recent Order History</h2>
                <table>
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Customer</th>
                            <th>Date</th>
                            <th>Status / Total</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td>#1024</td>
                            <td>Sarah Connor</td>
                            <td>Dec 25, 2:30 PM</td>
                            <td><span class="tag">$145.50</span></td>
                        </tr>
                        <tr>
                            <td>#1025</td>
                            <td>Rick Deckard</td>
                            <td>Dec 25, 4:45 PM</td>
                            <td><span class="tag">$89.99</span></td>
                        </tr>
                        <tr>
                            <td>#1026</td>
                            <td>Ellen Ripley</td>
                            <td>Dec 26, 9:12 AM</td>
                            <td><span class="tag">$210.00</span></td>
                        </tr>
                    </tbody>
                </table>
                <button class="btn-modern">+ Create New Order</button>
            </div>
        </div>
    </div>
</body>

</html>
